<!doctype html>
<html><head><meta charset="utf-8"><title>Blend</title>
<style>
body { background: #ffffff; color: #111111; font: 16px sans-serif; }
.tile { background: #f7f7f7; padding: 10px; }
.tile-image { mix-blend-mode: multiply; }
.direct { mix-blend-mode: darken; }
</style>
</head><body>
<div class="tile"><div class="tile-image" id="wrapped"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="10" height="10"><span>46% off</span></div></div>
<div class="tile"><img class="direct" id="direct" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="10" height="10"></div>
<div class="tile" id="later"></div>
<script>
setTimeout(() => {
  document.getElementById('later').innerHTML = '<div class="tile-image" id="late"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="10" height="10"></div>';
}, 300);
</script>
</body></html>
